[project]
name = "xnatctl"
version = "0.2.11"
description = "Modern CLI for XNAT neuroimaging server administration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Ricky Wong", email = "rickywonglt15@outlook.com"},
]
license = {text = "MIT"}
keywords = ["xnat", "neuroimaging", "cli", "dicom", "medical-imaging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "defusedxml>=0.7.1",
]

[project.scripts]
xnatctl = "xnatctl.cli.main:main"

[project.optional-dependencies]
dicom = [
    "pydicom>=2.4.0",
    "pynetdicom>=2.0.0",
]
keyring = [
    "keyring>=24",
]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pre-commit>=3.7.0",
    "types-PyYAML>=6.0.0",
    # Generates throwaway certs for the DICOM TLS tests. Without it those
    # tests skip, which is how the DICOM tier went years without running.
    "cryptography>=42",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1.0",
    "sphinx-copybutton>=0.5.0",
    "myst-parser>=3.0.0",
]

[project.urls]
homepage = "https://github.com/rickyltwong/xnatctl"
repository = "https://github.com/rickyltwong/xnatctl.git"
documentation = "https://xnatctl.readthedocs.io"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xnatctl"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "cryptography>=42",
    "mypy>=1.8.0",
    "pre-commit>=3.7.0",
    "pytest>=9.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "pytest-timeout>=2.0",
    "pytest-xdist>=3.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["xnatctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `from conftest import make_response` work from test modules regardless
# of pytest's import mode (shared test harness).
pythonpath = ["tests"]
# -q keeps CI logs readable at 1000+ tests; pass -v per-run when debugging.
# The integration tier is deselected by default.
addopts = "-q --tb=short -m 'not integration'"
# NOTE: use the ini options, not `--strict-markers`/`--strict-config` in
# addopts. Under pytest 9 those flags are only honoured on the command line and
# are silently ignored from addopts (verified against pytest 9.0.2).
# A marker not listed below is a collection error.
strict_markers = true
# An unparseable/unknown key in this section is an error, not a silent no-op.
strict_config = true
markers = [
    "integration: requires a live XNAT server (deselected by default; run with -m integration)",
]
filterwarnings = [
    # Own-code deprecations are bugs, not notices. The module field matches the
    # frame the warning is attributed to (i.e. the `stacklevel` target), so this
    # fires when xnatctl calls a deprecated API and stays quiet for warnings a
    # test module raises about itself.
    "error::DeprecationWarning:xnatctl.*",
]
# Per-test hang backstop, far above any legitimate test duration.
timeout = 120

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true

[tool.coverage.run]
source = ["xnatctl"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
# Coverage gate. Set just below the measured baseline so it catches
# regressions, not existing debt.
# Ratchet upward as the upload/download/DICOM test coverage lands.
# Keep this identical to --cov-fail-under in .github/workflows/ci.yml.
# 78 -> 82 once the DICOM tier actually ran in CI: installing the `dicom`
# extra took cli/dicom_cmd.py from 16% to 88% on its own.
fail_under = 82
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
