name: Manual Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip actual publish)"
        required: false
        default: false
        type: boolean

permissions: {}

defaults:
  run:
    shell: bash

env:
  UV_FROZEN: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Read version
        id: version
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = data["project"]["version"].strip()
          if not version:
              raise SystemExit("project.version is empty")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={version}\n")
          PY

      - name: Check PyPI for existing version
        run: |
          version="${{ steps.version.outputs.version }}"
          status=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/xnatctl/${version}/json")
          if [[ "$status" == "200" ]]; then
            echo "::error::Version ${version} already exists on PyPI"
            exit 1
          fi
          echo "Version ${version} not yet on PyPI — proceeding."

      - name: Lint
        run: uv run ruff check xnatctl scripts

      - name: Type check
        run: uv run mypy xnatctl

      - name: Test
        run: uv run pytest tests/ -v --tb=short
    outputs:
      version: ${{ steps.version.outputs.version }}

  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/xnatctl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build package
        run: uv build

      - name: Verify artifacts
        run: |
          echo "Built artifacts:"
          ls -lh dist/
          echo "Version from pyproject.toml: ${{ needs.verify.outputs.version }}"

      - name: Publish to PyPI
        if: ${{ !inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 provenance attestations via trusted publishing.
          attestations: true

      - name: Dry run — skipped publish
        if: ${{ inputs.dry_run }}
        run: echo "Dry run enabled — skipping publish for v${{ needs.verify.outputs.version }}"
