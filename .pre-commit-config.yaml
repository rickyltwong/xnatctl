repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (uv)
        entry: uv run --no-sync --frozen ruff check xnatctl tests scripts
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-format
        name: ruff format --check (uv)
        entry: uv run --no-sync --frozen ruff format --check xnatctl tests scripts
        language: system
        pass_filenames: false
        always_run: true

      - id: mypy
        name: mypy (uv)
        entry: uv run --no-sync --frozen mypy xnatctl
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest (uv)
        entry: uv run --no-sync --frozen pytest tests/ -v --tb=short
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
